<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naija Rush</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#008751">
<style>
:root{--bg:#10151c;--ink:#fff;--accent:#16a34a;--gold:#facc15;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c}}
:root[data-theme="dark"]{--bg:#10151c}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;font-weight:700;font-size:20px;text-shadow:0 2px 4px #000;pointer-events:none}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,12,18,.72);text-align:center;padding:24px}
.hidden{display:none}
h1{font-size:44px;margin:0;letter-spacing:2px;color:var(--gold)}
h2{font-size:34px;margin:0;color:#f87171}
p{margin:0;opacity:.9}
button{font-size:22px;font-weight:700;padding:14px 40px;border:0;border-radius:14px;background:var(--accent);color:#fff}
.sm{font-size:14px;opacity:.85;font-weight:600}
.panel{background:radial-gradient(circle at 50% 30%,rgba(0,135,81,.35),rgba(8,12,18,.92))}
h1{font-size:46px;letter-spacing:3px;text-shadow:0 3px 0 #006b40,0 6px 12px #000}
.flag{display:flex;width:84px;height:52px;border-radius:8px;overflow:hidden;box-shadow:0 4px 12px #0008}
.flag i{flex:1;background:#008751}.flag i:nth-child(2){background:#fff}
.card{background:rgba(0,0,0,.4);border-radius:14px;padding:10px 16px;font-size:14px;line-height:1.55;max-width:330px}
#hud>div{background:rgba(0,0,0,.38);padding:6px 14px;border-radius:16px}
#nb{color:var(--gold);font-weight:800;font-size:22px;animation:pulse .8s infinite alternate}
button{box-shadow:0 5px 0 #0b5f33,0 8px 16px #0008;transition:transform .08s}
button:active{transform:translateY(3px)}
@keyframes pulse{to{transform:scale(1.12)}}
#ctl{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 64px);display:flex;flex-direction:column;gap:8px;z-index:10}
.ic{width:46px;height:46px;padding:0;font-size:20px;border-radius:50%;background:rgba(0,0,0,.45);box-shadow:none}
.alt{background:#334155;font-size:18px;padding:10px 28px;box-shadow:0 4px 0 #1e293b}
</style>
</head><body>
<div id="hud"><div>Score <span id="sc">0</span><div class="sm"><span id="ds">0</span> m</div></div><div>&#x1FA99; <span id="cn">0</span></div><div>Best <span id="hi">0</span></div></div>
<div id="ctl"><button id="pz" class="ic" style="display:none">&#9208;</button><button id="mu" class="ic">&#128266;</button></div>
<div id="pause" class="panel hidden">
  <h2 style="color:var(--gold)">PAUSED</h2>
  <button id="res">RESUME</button>
  <button id="rst" class="alt">RESTART</button>
  <button id="sf" class="alt">Sound: On</button>
  <button id="ms" class="alt">Music: On</button>
</div>
<div id="menu" class="panel">
  <div class="flag"><i></i><i></i><i></i></div>
  <h1>NAIJA RUSH</h1>
  <p>Run the streets. Beat your best.</p>
  <div class="card">Swipe &larr; &rarr; to change lane, &uarr; to jump, &darr; to slide.<br>Keys: arrows / A D W S, Space to jump.<br>Jump low obstacles, slide under signs, dodge buses, grab coins.</div>
  <p>Best: <b id="mb">0</b></p>
  <button id="play">PLAY</button>
</div>
<div id="over" class="panel hidden">
  <h2>GAME OVER</h2>
  <p id="nb" class="hidden">NEW BEST!</p>
  <p>Score: <b id="fs">0</b></p>
  <p><b id="fd">0</b> m &nbsp;·&nbsp; <b id="fc">0</b> coins</p>
  <p>Best: <b id="fb">0</b></p>
  <button id="again">RESTART</button>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/BufferGeometryUtils.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const LANES = [-2.6, 0, 2.6], SEG = 40, NSEG = 4;

/* ---------- Renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ccfe8);
scene.fog = new THREE.Fog(0x9ccfe8, 40, 130);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 200);
let baseFov = 60;
const hemi = new THREE.HemisphereLight(0xffffff, 0x556655, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2cc, 0.8);
sun.position.set(-10, 20, 10);
scene.add(sun);
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  baseFov = w / h < 1 ? 78 : 60; camera.fov = baseFov;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* ---------- Helpers ---------- */
const mats = {};
const M = c => mats[c] || (mats[c] = new THREE.MeshLambertMaterial({ color: c }));
const BG = new THREE.BoxGeometry(1, 1, 1);
function box(w, h, d, c, x, y, z, p) {
  const m = new THREE.Mesh(BG, M(c));
  m.scale.set(w, h, d);
  m.position.set(x, y, z);
  if (p) p.add(m);
  return m;
}
const rnd = (a, b) => a + Math.random() * (b - a);
// Saving: localStorage when available, in-memory fallback so the game never crashes
const store = (() => { const mem = {}; return {
  get(k) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return k in mem ? mem[k] : null; },
  set(k, v) { mem[k] = String(v); try { localStorage.setItem(k, v); } catch (e) {} } }; })();
let pr = Math.min(window.devicePixelRatio || 1, +store.get('nrPR') || 1.5);
renderer.setPixelRatio(pr); resize();
// Sound: all generated with WebAudio (no audio files, no licensing). Starts after the first tap/key.
const audio = (() => {
  let ac = null, mt = null, n = 0;
  const on = { sfx: store.get('nrSfx') !== '0', mus: store.get('nrMus') !== '0' };
  const unlock = () => {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  };
  function tone(f, d, type, vol, to) {
    const a = unlock(); if (!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.02);
  }
  const sfx = (f, d, type, vol, to) => { if (on.sfx) tone(f, d, type, vol, to); };
  const BASS = [110, 110, 165, 110, 131, 131, 196, 131], LEAD = [440, 0, 523, 587, 0, 523, 440, 392];
  function beat() {
    const i = n++ % 16;
    if (!on.mus) return;
    if (i % 2 === 0) tone(BASS[(i >> 1) & 7], 0.22, 'triangle', 0.09);
    if (i % 4 !== 1 && LEAD[i % 8]) tone(LEAD[i % 8], 0.12, 'square', 0.02);
  }
  return {
    on, unlock,
    coin: () => sfx(880, 0.12, 'square', 0.07, 1320), jump: () => sfx(300, 0.18, 'sine', 0.15, 700),
    slide: () => sfx(500, 0.22, 'sawtooth', 0.05, 150), crash: () => sfx(160, 0.5, 'sawtooth', 0.2, 40),
    lane: () => sfx(420, 0.05, 'triangle', 0.05),
    musicStart() { unlock(); if (!mt) mt = setInterval(beat, 200); },
    musicStop() { clearInterval(mt); mt = null; },
    set(k, v) { on[k] = v; store.set(k === 'sfx' ? 'nrSfx' : 'nrMus', v ? '1' : '0'); }
  };
})();
// Merge a group of coloured boxes into ONE mesh (1 draw call instead of dozens)
const VCMAT = new THREE.MeshLambertMaterial({ vertexColors: true });
function merge(g) {
  g.updateMatrixWorld(true);
  const geos = [];
  g.children.forEach(m => {
    const ge = m.geometry.clone().applyMatrix4(m.matrix), n = ge.attributes.position.count, c = m.material.color, a = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
    ge.setAttribute('color', new THREE.BufferAttribute(a, 3));
    geos.push(ge);
  });
  const mesh = new THREE.Mesh(THREE.BufferGeometryUtils.mergeBufferGeometries(geos), VCMAT);
  mesh.userData = g.userData;
  return mesh;
}

/* ---------- Road segments (recycled) ---------- */
const PAL = [0xe8d9b5, 0xd97706, 0x60a5fa, 0xf472b6, 0x34d399, 0xcbd5e1, 0xfca5a5];
const AWN = [0xdc2626, 0x16a34a, 0xfacc15, 0x2563eb];
function buildSegment() {
  const g = new THREE.Group();
  box(8, 0.2, SEG, 0x2b2d31, 0, -0.1, 0, g);
  box(60, 0.1, SEG, 0x6b5a3e, 0, -0.25, 0, g);
  [-1, 1].forEach(s => {
    box(4, 0.3, SEG, 0x9a9a92, s * 6, 0.05, 0, g);
    box(0.12, 0.02, SEG, 0xffffff, s * 3.9, 0.01, 0, g);
    for (let k = 0; k < 3; k++) {
      const wx = rnd(5, 8), wz = 11, z = -13 + k * 13, h = rnd(6, 18);
      box(wx, h, wz, PAL[Math.random() * PAL.length | 0], s * (8.5 + wx / 2), h / 2, z, g);
      for (let y = 4.4; y < h - 0.8; y += 2.2) for (let c = -3; c <= 3; c += 2)
        box(0.08, 0.8, 0.9, Math.random() < 0.25 ? 0xfde68a : 0x3b4a5e, s * 8.46, y, z + c, g);
      if (Math.random() < 0.6) box(1.5, 1.1, 1.5, 0x111827, s * (8.5 + wx / 2), h + 0.55, z + rnd(-3, 3), g);
      box(1.6, 0.25, wz - 1, AWN[Math.random() * AWN.length | 0], s * 7.7, 3, z, g);
      box(0.1, 0.8, wz - 3, 0xfacc15, s * 8.45, 3.6, z, g);
      box(0.1, 2.2, wz * 0.5, 0x1f2937, s * 8.45, 1.2, z, g);
    }
    [-10, 10].forEach(z => {
      box(0.15, 6, 0.15, 0x374151, s * 4.4, 3, z, g);
      box(1.2, 0.12, 0.12, 0x374151, s * 3.85, 6, z, g);
      box(0.4, 0.15, 0.3, 0xfff3b0, s * 3.3, 5.9, z, g);
    });
    const pz = rnd(-5, 2);
    box(0.3, 4, 0.3, 0x8b6b4a, s * 5.2, 2.2, pz, g);
    for (let a = 0; a < 4; a++) box(3, 0.1, 0.5, 0x15803d, s * 5.2, 4.2, pz, g).rotation.y = a * Math.PI / 4;
    box(1.4, 0.9, 1.0, 0x8b5e3c, s * 6.2, 0.65, 6, g);
    box(0.08, 2, 0.08, 0x374151, s * 6.2, 1.2, 6, g);
    box(2, 0.12, 2, AWN[Math.random() * AWN.length | 0], s * 6.2, 2.2, 6, g);
  });
  [-1.3, 1.3].forEach(x => { for (let i = 0; i < 4; i++) box(0.14, 0.02, 3, 0xffffff, x, 0.01, -15 + i * 10, g); });
  if (Math.random() < 0.5) for (let x = -3.3; x <= 3.4; x += 1.1) box(0.6, 0.02, 3, 0xe5e7eb, x, 0.015, 0, g);
  return merge(g);
}
const segs = [];
for (let i = 0; i < NSEG; i++) { const s = buildSegment(); s.position.z = -i * SEG; scene.add(s); segs.push(s); }

/* ---------- Runner ---------- */
const runner = new THREE.Group();
function limb(w, h, d, c, x, y) {
  const piv = new THREE.Group();
  piv.position.set(x, y, 0);
  box(w, h, d, c, 0, -h / 2, 0, piv);
  runner.add(piv);
  return piv;
}
box(0.7, 0.9, 0.4, 0x16a34a, 0, 1.25, 0, runner);
box(0.4, 0.4, 0.4, 0x5b3a29, 0, 1.95, 0, runner);
box(0.44, 0.14, 0.44, 0xffffff, 0, 2.2, 0, runner);
const legL = limb(0.28, 0.8, 0.3, 0x1e3a8a, -0.18, 0.8);
const legR = limb(0.28, 0.8, 0.3, 0x1e3a8a, 0.18, 0.8);
const armL = limb(0.2, 0.7, 0.2, 0x5b3a29, -0.5, 1.65);
const armR = limb(0.2, 0.7, 0.2, 0x5b3a29, 0.5, 1.65);
scene.add(runner);
// Human model (Mixamo "Soldier", from three.js examples). Block runner stays as fallback if it fails to load.
let mixer = null, cur = null; const actions = {};
const blockParts = runner.children.slice();
function playAnim(n) {
  const a = actions[n];
  if (!a || a === cur) return;
  a.reset().fadeIn(0.2).play();
  if (cur) cur.fadeOut(0.2);
  cur = a;
}
if (THREE.GLTFLoader) new THREE.GLTFLoader().load('models/Soldier.glb', gltf => {
  const m = gltf.scene;
  m.rotation.y = 0; m.scale.setScalar(1.15);
  m.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
  mixer = new THREE.AnimationMixer(m);
  gltf.animations.forEach(c => { actions[c.name] = mixer.clipAction(c); });
  blockParts.forEach(p => { p.visible = false; });
  runner.add(m);
  playAnim(state === 'play' ? 'Run' : 'Idle');
}, undefined, e => console.warn('Model failed to load; using block runner', e));

/* ---------- Obstacles ---------- */
const obstacles = [];
function buildObstacle(type) {
  const g = new THREE.Group();
  if (type === 'crate') {
    box(1.4, 1.2, 1.4, 0x9a6a3a, 0, 0.6, 0, g);
    box(1.44, 0.16, 1.44, 0x7c5228, 0, 0.6, 0, g);
    g.userData = { w: 0.7, d: 0.7, y0: 0, y1: 1.2 };
  } else if (type === 'barrier') {
    box(2.2, 0.5, 0.4, 0xdc2626, 0, 0.95, 0, g);
    box(0.4, 0.5, 0.42, 0xffffff, -0.6, 0.95, 0, g);
    box(0.4, 0.5, 0.42, 0xffffff, 0.6, 0.95, 0, g);
    box(0.12, 0.9, 0.12, 0x374151, -0.9, 0.45, 0, g);
    box(0.12, 0.9, 0.12, 0x374151, 0.9, 0.45, 0, g);
    g.userData = { w: 1.1, d: 0.3, y0: 0, y1: 1.2 };
  } else if (type === 'sign') {
    box(0.12, 2.2, 0.12, 0x374151, -1.0, 1.1, 0, g);
    box(0.12, 2.2, 0.12, 0x374151, 1.0, 1.1, 0, g);
    box(2.2, 0.65, 0.3, 0x2563eb, 0, 1.7, 0, g);
    box(1.8, 0.2, 0.32, 0xffffff, 0, 1.7, 0, g);
    g.userData = { w: 1.1, d: 0.3, y0: 1.3, y1: 2.05 };
  } else {
    box(2.0, 1.4, 4.6, 0xfacc15, 0, 1.15, 0, g);
    box(1.9, 0.3, 4.4, 0xfacc15, 0, 2.0, 0, g);
    box(2.02, 0.5, 3.6, 0x1e293b, 0, 1.65, 0, g);
    box(2.03, 0.22, 4.62, 0x111111, 0, 1.0, 0, g);
    box(2.0, 0.4, 4.4, 0x111111, 0, 0.35, 0, g);
    g.userData = { w: 1.0, d: 2.3, y0: 0, y1: 2.2 };
  }
  return merge(g);
}
// Build each obstacle type once, then clone (shares geometry: no per-spawn garbage or GPU uploads)
const OBS = {};
const makeObstacle = type => (OBS[type] || (OBS[type] = buildObstacle(type))).clone();
let prevFree = 1;
function spawnRow() {
  const opts = [prevFree - 1, prevFree, prevFree + 1].filter(l => l >= 0 && l <= 2);
  const free = opts[Math.random() * opts.length | 0];
  let blocked = [0, 1, 2].filter(l => l !== free);
  if (Math.random() >= Math.min(0.6, Math.max(0, (speed - 16) / 30))) blocked = [blocked[Math.random() * 2 | 0]];
  prevFree = free;
  for (let k = 0; k < 5; k++) {
    const c = new THREE.Mesh(COIN_G, COIN_M);
    c.position.set(LANES[free], 1.0, -115 + k * 2.5);
    scene.add(c); coinList.push(c);
  }
  blocked.forEach(l => {
    const o = makeObstacle(['crate', 'barrier', 'bus', 'sign'][Math.random() * 4 | 0]);
    o.position.set(LANES[l], 0, -115);
    scene.add(o);
    obstacles.push(o);
  });
}

/* ---------- Game state ---------- */
let state = 'menu', speed = 14, dist = 0, lane = 1, sinceSpawn = 1e9, anim = 0, lastScore = -1;
let coins = 0, py = 0, vy = 0, slideT = 0, wantSlide = false, slideK = 0, shake = 0;
const popList = [];
const SKY_A = new THREE.Color(0x9ccfe8), SKY_B = new THREE.Color(0xf4b183), SUN_A = new THREE.Color(0xfff2cc), SUN_B = new THREE.Color(0xffa45c);
function updSky() { // day slowly turns to golden hour and back
  const p = (1 - Math.cos(dist / 450)) / 2;
  scene.background.copy(SKY_A).lerp(SKY_B, p * 0.85);
  scene.fog.color.copy(scene.background);
  sun.color.copy(SUN_A).lerp(SUN_B, p);
  sun.intensity = 0.8 - 0.2 * p; hemi.intensity = 0.95 - 0.2 * p;
}
const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.6, 16).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35, depthWrite: false }));
shadow.position.y = 0.03;
scene.add(shadow);
const coinList = [];
const COIN_G = new THREE.CylinderGeometry(0.35, 0.35, 0.08, 14).rotateX(Math.PI / 2);
const COIN_M = new THREE.MeshLambertMaterial({ color: 0xfacc15, emissive: 0x553d00 });
const score = () => Math.floor(dist) + coins * 10;
const updScore = () => { $('sc').textContent = score(); };
let best = 0;
best = +store.get('naijaRushBest') || 0;
$('hi').textContent = best;
$('mb').textContent = best;

function syncUI() {
  $('pz').style.display = (state === 'play' || state === 'pause') ? '' : 'none';
  $('mu').textContent = (audio.on.sfx || audio.on.mus) ? '\u{1F50A}' : '\u{1F507}';
  $('sf').textContent = 'Sound: ' + (audio.on.sfx ? 'On' : 'Off');
  $('ms').textContent = 'Music: ' + (audio.on.mus ? 'On' : 'Off');
}
function pauseGame() { if (state !== 'play') return; state = 'pause'; audio.musicStop(); $('pause').classList.remove('hidden'); syncUI(); }
function resumeGame() { if (state !== 'pause') return; state = 'play'; $('pause').classList.add('hidden'); audio.musicStart(); syncUI(); }
function startGame() {
  obstacles.forEach(o => scene.remove(o));
  obstacles.length = 0;
  coinList.forEach(c => scene.remove(c));
  coinList.length = 0;
  coins = 0; py = 0; vy = 0; slideT = 0; wantSlide = false;
  $('cn').textContent = 0; $('sc').textContent = 0; $('ds').textContent = 0;
  speed = 14; dist = 0; lane = 1; prevFree = 1; sinceSpawn = 1e9; lastScore = -1;
  runner.position.x = 0;
  playAnim('Run');
  popList.forEach(p => scene.remove(p.m)); popList.length = 0; shake = 0; updSky();
  $('menu').classList.add('hidden');
  $('over').classList.add('hidden');
  $('pause').classList.add('hidden');
  state = 'play';
  audio.musicStart();
  syncUI();
}
function gameOver() {
  state = 'over';
  audio.crash(); audio.musicStop();
  playAnim('Idle');
  const s = score();
  $('fd').textContent = Math.floor(dist);
  $('fc').textContent = coins;
  const isNew = s > best;
  $('nb').classList[isNew ? 'remove' : 'add']('hidden');
  shake = 0.6;
  if (isNew) {
    best = s;
    store.set('naijaRushBest', best);
  }
  $('hi').textContent = best;
  $('mb').textContent = best;
  $('fs').textContent = s;
  $('fb').textContent = best;
  $('over').classList.remove('hidden');
  syncUI();
}
$('play').addEventListener('click', startGame);
$('again').addEventListener('click', startGame);
$('res').addEventListener('click', resumeGame);
$('rst').addEventListener('click', startGame);
$('pz').addEventListener('click', () => (state === 'pause' ? resumeGame() : pauseGame()));
$('mu').addEventListener('click', () => { const v = !(audio.on.sfx || audio.on.mus); audio.set('sfx', v); audio.set('mus', v); audio.unlock(); syncUI(); });
$('sf').addEventListener('click', () => { audio.set('sfx', !audio.on.sfx); syncUI(); });
$('ms').addEventListener('click', () => { audio.set('mus', !audio.on.mus); syncUI(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('blur', pauseGame);
syncUI();

/* ---------- Input ---------- */
const move = d => { if (state === 'play') { const n = Math.max(0, Math.min(2, lane + d)); if (n !== lane) { lane = n; audio.lane(); } } };
window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') move(-1);
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') move(1);
  else if (e.code === 'ArrowUp' || e.code === 'KeyW') jump();
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') slide();
  else if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'pause') resumeGame(); else pauseGame(); }
  else if (e.code === 'Space' || e.code === 'Enter') { if (state === 'pause') resumeGame(); else if (state !== 'play') startGame(); else jump(); }
});
function jump() { if (state === 'play' && py <= 0.001) { vy = 11; slideT = 0; wantSlide = false; audio.jump(); } }
function slide() { if (state !== 'play') return; if (py > 0.001) { vy = -18; wantSlide = true; } else slideT = 0.7; audio.slide(); }
// Swipes fire as soon as the finger moves 30px, so controls feel instant
let sx = 0, sy = 0, fired = true;
window.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; fired = false; });
window.addEventListener('pointerup', () => { fired = true; });
window.addEventListener('pointercancel', () => { fired = true; });
window.addEventListener('pointermove', e => {
  if (fired) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
  fired = true;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1); else if (dy < 0) jump(); else slide();
});

/* ---------- Main loop ---------- */
let last = performance.now(), fAcc = 0, fN = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const raw = (now - last) / 1000, dt = Math.min(raw, 0.05);
  last = now;
  if (state === 'play' && raw < 0.5) { fAcc += raw; fN++; }
  if (fAcc > 2.5) { // adaptive quality: lower resolution if average FPS < 40
    if (fN / fAcc < 40 && pr > 0.75) { pr = Math.max(0.75, pr - 0.25); renderer.setPixelRatio(pr); store.set('nrPR', pr); resize(); }
    fAcc = 0; fN = 0;
  }
  const v = state === 'play' ? speed : state === 'menu' ? 6 : 0;
  const step = v * dt;

  if (state === 'play') {
    speed = Math.min(36, speed + 0.25 * dt);
    dist += step;
    updSky();
    sinceSpawn += step;
    if (sinceSpawn >= Math.max(18, speed * 1.1)) { spawnRow(); sinceSpawn = 0; }
    const s = Math.floor(dist);
    if (s !== lastScore) { lastScore = s; $('ds').textContent = s; updScore(); }
  }
  segs.forEach(s => { s.position.z += step; if (s.position.z > 40) s.position.z -= SEG * NSEG; });
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.position.z += step;
    if (o.position.z > 12) { scene.remove(o); obstacles.splice(i, 1); }
  }

  if (state === 'play') {
    if (py > 0 || vy > 0) {
      vy -= 30 * dt; py += vy * dt;
      if (py <= 0) { py = 0; vy = 0; if (wantSlide) { slideT = 0.7; wantSlide = false; } }
    }
    if (slideT > 0) slideT -= dt;
  }
  runner.position.y = py;
  slideK += ((slideT > 0 ? 1 : 0) - slideK) * Math.min(1, dt * 18);
  runner.scale.y = 1 - 0.15 * slideK;
  runner.rotation.x = 1.1 * slideK;
  shadow.position.x = runner.position.x;
  shadow.scale.setScalar(1 / (1 + py * 0.7));
  const top = py + (slideT > 0 ? 0.9 : 1.9);
  for (let i = coinList.length - 1; i >= 0; i--) {
    const c = coinList[i];
    c.position.z += step; c.rotation.y += dt * 4;
    if (state === 'play' && Math.abs(c.position.z) < 0.8 && Math.abs(c.position.x - runner.position.x) < 0.8 && c.position.y > py - 0.3 && c.position.y < top + 0.3) {
      coinList.splice(i, 1); popList.push({ m: c, t: 0 }); coins++; audio.coin(); $('cn').textContent = coins; updScore();
    } else if (c.position.z > 8) { scene.remove(c); coinList.splice(i, 1); }
  }
  for (let i = popList.length - 1; i >= 0; i--) {
    const p = popList[i];
    p.t += dt; p.m.position.y += dt * 3; p.m.position.z += step; p.m.scale.setScalar(Math.max(0.01, 1 - p.t * 5));
    if (p.t > 0.2) { scene.remove(p.m); popList.splice(i, 1); }
  }
  runner.position.x += (LANES[lane] - runner.position.x) * Math.min(1, dt * 14);
  runner.rotation.z = -(LANES[lane] - runner.position.x) * 0.18;
  if (state === 'play' || state === 'menu') {
    anim += dt * (state === 'play' ? speed * 0.6 : 6);
    const sw = Math.sin(anim) * 0.9;
    legL.rotation.x = sw; legR.rotation.x = -sw;
    armL.rotation.x = -sw; armR.rotation.x = sw;
    if (!mixer && py === 0) runner.position.y = Math.abs(Math.sin(anim)) * 0.08;
  }

  if (mixer) mixer.update(state === 'over' || state === 'pause' ? 0 : dt * (state === 'play' ? (0.7 + speed / 40) * (py > 0 ? 0.25 : 1) : 1));
  if (state === 'play') {
    for (const o of obstacles) {
      if (Math.abs(o.position.z) < o.userData.d + 0.25 &&
          Math.abs(o.position.x - runner.position.x) < o.userData.w + 0.35 &&
          top > o.userData.y0 + 0.05 && py < o.userData.y1 - 0.15) { gameOver(); break; }
    }
  }

  camera.position.x += (runner.position.x * 0.55 - camera.position.x) * Math.min(1, dt * 6);
  camera.position.y = 4.3; camera.position.z = 8.2;
  camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake;
  shake = Math.max(0, shake - dt * 1.6);
  camera.lookAt(runner.position.x * 0.4, 1.4, -10);
  const tf = baseFov + (state === 'play' ? (speed - 14) * 0.25 : 0);
  if (Math.abs(tf - camera.fov) > 0.05) { camera.fov += (tf - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
  if (window.__fps) window.__fps();
}
if (/[?&]fps=1/.test(location.search)) {
  const f = document.createElement('div');
  f.style.cssText = 'position:fixed;left:8px;bottom:8px;font:12px monospace;background:#0009;padding:4px 6px;border-radius:6px';
  document.body.appendChild(f);
  let n = 0, t0 = performance.now();
  window.__fps = () => { n++; const t = performance.now(); if (t - t0 > 1000) { f.textContent = Math.round(n * 1000 / (t - t0)) + ' fps, ' + renderer.info.render.calls + ' draw calls'; n = 0; t0 = t; } };
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol))
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
requestAnimationFrame(loop);
})();
</script>
